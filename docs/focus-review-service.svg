<text x="820" y="464" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">API 13개  (공개 9 · 관리자 1 · internal 3)</text>
<text x="622.0" y="381.0" font-size="13" font-weight="bold" text-anchor="start" fill="#22C55E">이 레포</text>
