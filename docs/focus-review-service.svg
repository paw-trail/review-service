<text x="1560" y="518" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">pet-service</text>
<text x="1560" y="538" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">쓸 때 스냅샷 (견종 · 체중 · 크기)</text>
<text x="1560" y="554" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">GET /internal/pets?ids=  못 받으면 작성 실패</text>
