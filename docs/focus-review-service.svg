<text x="1560" y="306" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">좋아요 수는 트리거가 유지함</text>
<text x="1560" y="322" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">Redis 안 씀</text>
