<text x="388" y="742" font-size="13" font-weight="normal" text-anchor="end" fill="#9CA3AF">account.withdrawn</text>
<text x="40" y="900" font-size="13" font-weight="normal" text-anchor="start" fill="#4B5563">후기를 쓸 때만 pet 을 부르고 그때 견종 · 체중 · 크기를 복사해 둠 — 못 받으면 작성을 실패시킴 (그때만 찍을 수 있는 값이라 나중에 채울 길이 없음)</text>
<text x="40" y="922" font-size="13" font-weight="normal" text-anchor="start" fill="#4B5563">place · user 는 양방향 — review 가 이름을 받아 오고, 그쪽은 후기 수(장소 상세)와 기간 목록(하루 요약)을 받아 감 · 이름을 못 받으면 그 칸만 비운 채 목록을 냄</text>
<text x="40" y="944" font-size="13" font-weight="normal" text-anchor="start" fill="#4B5563">이벤트는 받기만 함 (Outbox 표는 비어 있음) · 사용자 삭제는 행을 남기고 탈퇴는 실제로 지움 · 좋아요 수는 review_like 의 트리거가 ±1 함</text>
<text x="1836" y="948" font-size="11" text-anchor="end" fill="#9CA3AF">review-service 를 중심으로 · 직접 연결된 것만</text></svg>